<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear - My Profile</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { overflow-y: auto; display: flex; flex-direction: column; min-height: 100vh; }

        .profile-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 60px;
            font-family: 'Mitr', sans-serif;
        }

        /* --- Top Nav Links --- */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        /* --- Tab Switcher --- */
        .tab-bar {
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.04);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 10px 28px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #a4b0be;
            font-size: 0.9rem;
            font-family: 'Mitr', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #c02020;
            color: #fff;
            box-shadow: 0 4px 15px rgba(192,32,32,0.4);
        }
        .tab-btn i { margin-right: 8px; }

        /* --- Panel --- */
        .panel {
            width: 100%;
            max-width: 700px;
            display: none;
        }
        .panel.active { display: block; }

        /* --- Profile Card --- */
        .glass-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 35px;
            backdrop-filter: blur(20px);
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .avatar-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #c02020;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 0 25px rgba(192,32,32,0.4);
            background: rgba(255,255,255,0.05);
        }
        .avatar-ring i { font-size: 3.5rem; color: #c02020; }
        .avatar-ring img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-name { font-size: 1.3rem; color: #fff; font-weight: 600; }
        .avatar-email { font-size: 0.85rem; color: #a4b0be; margin-top: 2px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 0.8rem; color: #a4b0be; font-weight: 500; }
        .form-group input {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Mitr', sans-serif;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: #c02020; background: rgba(192,32,32,0.05); }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: #c02020;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Mitr', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn-save:hover { background: #a01010; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(192,32,32,0.4); }

        /* --- Order History --- */
        .order-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .order-card:hover { border-color: rgba(192,32,32,0.4); background: rgba(192,32,32,0.03); }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .order-id { font-size: 0.95rem; color: #fff; font-weight: 600; }
        .order-date { font-size: 0.8rem; color: #57606f; }
        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .status-processing { background: rgba(241,196,15,0.15); color: #f1c40f; border: 1px solid rgba(241,196,15,0.3); }
        .status-confirmed { background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }

        .order-items {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .item-name { color: #a4b0be; }
        .item-qty { color: #57606f; margin-left: 8px; }
        .item-price { color: #fff; font-weight: 500; }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 12px;
            margin-top: 5px;
        }
        .order-total span { color: #a4b0be; font-size: 0.85rem; }
        .order-total strong { color: #c02020; font-size: 1.1rem; }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            color: #57606f;
        }
        .empty-orders i { font-size: 3.5rem; margin-bottom: 15px; display: block; color: #2f3542; }
        .empty-orders p { font-size: 1rem; }
        .empty-orders a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: #c02020;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .section-title span { color: #c02020; }

        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Top Nav -->
    <div class="top-nav">
        <a href="index.html" style="color:#a4b0be; text-decoration:none; font-size:0.9rem;">
            <i class="fas fa-arrow-left"></i> Back to Store
        </a>
        <div style="display:flex; gap:8px; align-items:center; color:#57606f;">
            <a href="#" class="lang-btn active" data-lang="en" style="color:#c02020; text-decoration:none; font-family:'Mitr',sans-serif;">EN</a>
            <span>|</span>
            <a href="#" class="lang-btn" data-lang="th" style="color:#a4b0be; text-decoration:none; font-family:'Mitr',sans-serif;">TH</a>
        </div>
    </div>

    <div class="bg-orb orb-red"></div>
    <div class="bg-orb orb-gray"></div>

    <div class="profile-page">

        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('profile')">
                <i class="fas fa-user"></i><span data-i18n="tab_profile">My Profile</span>
            </button>
            <button class="tab-btn" onclick="switchTab('orders')">
                <i class="fas fa-receipt"></i><span data-i18n="tab_orders">Order History</span>
            </button>
        </div>

        <!-- Profile Tab -->
        <div class="panel active" id="panel-profile">
            <div class="glass-panel">
                <div class="avatar-section">
                    <label for="avatarInput" style="cursor:pointer;">
                        <div class="avatar-ring" id="avatarRing">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </label>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                    <div class="avatar-name" id="displayName">Loading...</div>
                    <div class="avatar-email" id="displayEmail"></div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-user" style="margin-right:5px; color:#c02020;"></i><span data-i18n="prof_fname">Full Name</span></label>
                        <input type="text" id="profName" data-i18n-placeholder="ph_fullname" placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone" style="margin-right:5px; color:#c02020;"></i><span data-i18n="prof_phone">Phone</span></label>
                        <input type="tel" id="profPhone" data-i18n-placeholder="ph_phone" placeholder="Phone Number">
                    </div>
                    <div class="form-group full">
                        <label><i class="fas fa-envelope" style="margin-right:5px; color:#c02020;"></i><span data-i18n="prof_email">Email</span></label>
                        <input type="email" id="profEmail" data-i18n-placeholder="ph_email" placeholder="Email">
                    </div>
                    <div class="form-group full">
                        <label><i class="fas fa-map-marker-alt" style="margin-right:5px; color:#c02020;"></i><span data-i18n="prof_address">Shipping Address</span></label>
                        <input type="text" id="profAddress" data-i18n-placeholder="ph_address" placeholder="Shipping Address">
                    </div>
                    <div class="form-group full">
                        <label><i class="fas fa-lock" style="margin-right:5px; color:#c02020;"></i><span data-i18n="prof_password">New Password</span></label>
                        <input type="password" id="profPassword" data-i18n-placeholder="ph_password" placeholder="Leave blank to keep current">
                    </div>
                </div>

                <button class="btn-save" id="saveBtn" onclick="saveProfile()">
                    <i class="fas fa-save" style="margin-right:8px;"></i><span data-i18n="prof_save">SAVE CHANGES</span>
                </button>
            </div>
        </div>

        <!-- Orders Tab -->
        <div class="panel" id="panel-orders">
            <div class="section-title">
                <i class="fas fa-receipt" style="margin-right:8px; color:#c02020;"></i>
                <span data-i18n="orders_title">Your Orders</span>
                <span id="orderCount" style="font-size:0.8rem; color:#57606f; margin-left:8px;"></span>
            </div>
            <div id="orderList">
                <div class="empty-orders">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="lang.js"></script>
    <script src="auth.js"></script>
    <script>
        // Tab switching
        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            event.currentTarget.classList.add('active');
            if (name === 'orders') loadOrders();
        }

        // Load user data
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) return;

            // Show name & email
            document.getElementById('displayName').textContent = currentUser.name || currentUser.username;
            document.getElementById('displayEmail').textContent = currentUser.username || '';

            // Prefill form
            document.getElementById('profName').value = currentUser.name || '';
            document.getElementById('profEmail').value = currentUser.email || '';
            document.getElementById('profPhone').value = currentUser.phone || '';
            document.getElementById('profAddress').value = currentUser.address || '';

            // Avatar
            if (currentUser.avatar) {
                const ring = document.getElementById('avatarRing');
                ring.innerHTML = `<img src="${currentUser.avatar}" alt="avatar">`;
            }

            // Avatar upload
            document.getElementById('avatarInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const ring = document.getElementById('avatarRing');
                    ring.innerHTML = `<img src="${ev.target.result}" alt="avatar">`;
                    currentUser.avatar = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // Save profile to localStorage
        function saveProfile() {
            const name = document.getElementById('profName').value.trim();
            const email = document.getElementById('profEmail').value.trim();
            const phone = document.getElementById('profPhone').value.trim();
            const address = document.getElementById('profAddress').value.trim();
            const password = document.getElementById('profPassword').value;

            currentUser.name = name || currentUser.name;
            currentUser.email = email || currentUser.email;
            currentUser.phone = phone || currentUser.phone;
            currentUser.address = address || currentUser.address;
            if (password) currentUser.password = password;

            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            document.getElementById('displayName').textContent = currentUser.name || currentUser.username;

            // Show success toast
            if (typeof showToast === 'function') showToast('Profile saved!', false);
            else alert('Profile saved!');
        }

        // Load order history
        async function loadOrders() {
            const container = document.getElementById('orderList');
            if (!currentUser) return;

            const username = currentUser.username;
            container.innerHTML = `<div class="empty-orders"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>`;

            try {
                const res = await fetch('/api/orders/user/' + encodeURIComponent(username));
                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-orders">
                            <i class="fas fa-box-open"></i>
                            <p>No orders yet!</p>
                            <a href="index.html"><i class="fas fa-shopping-cart" style="margin-right:6px;"></i>Shop Now</a>
                        </div>`;
                    document.getElementById('orderCount').textContent = '';
                    return;
                }

                document.getElementById('orderCount').textContent = `(${orders.length} orders)`;
                const lang = localStorage.getItem('preferredLanguage') || 'en';

                container.innerHTML = orders.map(order => {
                    const statusClass = order.status === 'Confirmed' ? 'status-confirmed' : 'status-processing';
                    const statusText = order.status === 'Confirmed'
                        ? (lang === 'th' ? 'ยืนยันแล้ว' : 'Confirmed')
                        : (lang === 'th' ? 'กำลังดำเนินการ' : 'Processing');

                    const itemsHtml = Array.isArray(order.items) && order.items.length > 0
                        ? order.items.map(item => `
                            <div class="order-item">
                                <span class="item-name">${item.title_en || item.title || 'Product'}<span class="item-qty">x${item.qty || 1}</span></span>
                                <span class="item-price">\$${((item.price || 0) * (item.qty || 1)).toFixed(2)}</span>
                            </div>`).join('')
                        : `<div class="order-item"><span class="item-name" style="color:#57606f;">No item details</span></div>`;

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <div class="order-id"><i class="fas fa-hashtag" style="color:#c02020; margin-right:4px; font-size:0.8rem;"></i>${order.id}</div>
                                    <div class="order-date"><i class="fas fa-clock" style="margin-right:5px;"></i>${new Date(order.date).toLocaleString()}</div>
                                </div>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="order-items">${itemsHtml}</div>
                            <div class="order-total">
                                <span><i class="fas fa-map-marker-alt" style="margin-right:5px;"></i>${order.address || '-'}</span>
                                <strong>\$${(order.total || 0).toFixed(2)}</strong>
                            </div>
                        </div>`;
                }).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="empty-orders"><i class="fas fa-exclamation-circle" style="color:#c02020;"></i><p>Could not load orders. Try again later.</p></div>`;
            }
        }
    </script>
    <script src="footer.js"></script>
</body>
</html>
